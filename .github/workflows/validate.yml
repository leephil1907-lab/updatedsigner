name: validate
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile gateway.py
      - run: python - <<'PY'
import pathlib
for p in ["index.html","styles.css","app.js","README.md"]:
    assert pathlib.Path(p).exists(), p
print("frontend files present")
PY
